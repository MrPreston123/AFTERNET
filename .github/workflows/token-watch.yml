# Backup launch watcher: pings the token endpoint every 5 minutes. The endpoint posts the
# Discord launch announcement (once) as soon as $AFTERNET exists on-chain, even if nobody is on the site.
name: Token launch watch

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 30 https://afternet-discord.vercel.app/api/token
